<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кейсер v4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { background: radial-gradient(circle at top, #1a1a2e 0%, #0a0a15 100%); min-height: 100vh; font-family: Arial, sans-serif; color: #fff; padding-bottom: 40px; transition: background 0.4s, color 0.4s; }
  body.light { background: radial-gradient(circle at top, #f0f0ff 0%, #d0d0e0 100%); color: #111; }
  body.light header { background: linear-gradient(90deg, #ffb84d, #ffcc66, #ffb84d); }
  body.light .case, body.light .upgrade, body.light .inv-item, body.light .stat-box, body.light .ach { background: linear-gradient(160deg, #ffffff, #e8e8f0); color: #111; border-color: #bbb; }
  body.light .inventory, body.light #achievements, body.light #stats, body.light #history, body.light #minigame { background: rgba(255,255,255,0.6); border-color: #bbb; }
  body.light .notif { background: #fff; color: #111; }
  header { background: linear-gradient(90deg, #ff8c00, #ffaa00, #ff8c00); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px; transition: background 0.4s; }
  header h1 { font-size: 24px; color: #111; letter-spacing: 2px; }
  .header-right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .balance-box { background: rgba(0,0,0,0.75); padding: 10px 20px; border-radius: 30px; font-size: 20px; font-weight: bold; color: #4fff4f; border: 2px solid #4fff4f; }
  .prestige-box { background: rgba(191,79,255,0.2); padding: 8px 14px; border-radius: 20px; font-size: 14px; color: #bf4fff; border: 2px solid #bf4fff; font-weight: bold; }
  .top-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .top-btns button { background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #444; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  body.light .top-btns button { background: rgba(255,255,255,0.7); color: #111; }
  .top-btns button:hover { border-color: #ffaa00; }
  .clicker-section { display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
  .clicker-btn { width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffe066, #ff8c00); border: 6px solid #ffaa00; cursor: pointer; font-size: 18px; font-weight: 900; color: #111; line-height: 1.3; transition: transform 0.05s; }
  .clicker-btn:active { transform: scale(0.92); }
  .clicker-hint { margin-top: 12px; color: #888; font-size: 13px; text-align: center; }
  .click-anim { position: fixed; pointer-events: none; font-size: 22px; font-weight: bold; color: #4fff4f; text-shadow: 2px 2px 6px #000; animation: clickFloat 1s forwards; z-index: 200; }
  @keyframes clickFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
  .section-title { text-align: center; font-size: 26px; margin: 25px 0 15px; color: #ffaa00; letter-spacing: 3px; }
  .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; max-width: 1000px; margin: 0 auto; padding: 0 20px; }
  .case { background: linear-gradient(160deg, #1e1e2e, #0f0f1a); border: 2px solid #333; border-radius: 15px; padding: 22px; text-align: center; transition: all 0.3s; }
  .case:hover { border-color: #ffaa00; transform: translateY(-5px); }
  .case-icon { font-size: 65px; margin-bottom: 12px; }
  .case h3 { font-size: 18px; margin-bottom: 8px; color: #ffaa00; }
  .case .price-tag { font-size: 18px; color: #4fff4f; font-weight: bold; margin-bottom: 12px; }
  .case .open-btn { padding: 10px 28px; background: linear-gradient(90deg, #ff8c00, #ffaa00); border: none; border-radius: 22px; color: #111; font-weight: bold; font-size: 14px; cursor: pointer; }
  .case .open-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .case .open-btn.free { background: linear-gradient(90deg, #4fff4f, #00aa00); color: #fff; }
  .inventory { max-width: 1000px; margin: 30px auto 0; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 2px solid #333; }
  .inv-title { font-size: 20px; color: #ffaa00; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .inv-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .inv-actions button { background: #222; color: #fff; border: 2px solid #444; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .inv-actions button:hover { border-color: #ffaa00; }
  .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; }
  .inv-item { background: #1a1a2a; border: 2px solid #333; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .inv-item:hover { transform: translateY(-3px); }
  .inv-item .icon { font-size: 36px; }
  .inv-item .name { font-size: 10px; color: #ccc; margin-top: 4px; }
  body.light .inv-item .name { color: #555; }
  .inv-item .price { font-size: 12px; color: #4fff4f; margin-top: 3px; font-weight: bold; }
  .inv-item.legendary { box-shadow: 0 0 15px #ffaa00; animation: legendGlow 1.5s infinite alternate; }
  @keyframes legendGlow { 0% { box-shadow: 0 0 8px #ffaa00; } 100% { box-shadow: 0 0 25px #ffaa00; } }
  .inv-item.epic { box-shadow: 0 0 10px #bf4fff; }
  .inv-item.rare { box-shadow: 0 0 8px #4f4fff; }
  .inv-empty { color: #555; text-align: center; padding: 30px; grid-column: 1/-1; }
  #roulette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
  #roulette-overlay.active { display: flex; }
  .roulette-title { font-size: 30px; color: #ffaa00; margin-bottom: 22px; letter-spacing: 3px; }
  .roulette-container { width: 90%; max-width: 900px; height: 170px; background: #0a0a15; border: 3px solid #ffaa00; border-radius: 15px; overflow: hidden; position: relative; }
  .roulette-track { display: flex; height: 100%; }
  .roulette-item { min-width: 140px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #222; padding: 10px; text-align: center; }
  .roulette-item .icon { font-size: 50px; margin-bottom: 4px; }
  .roulette-item .name { font-size: 11px; color: #ccc; }
  .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%; background: #ff2020; box-shadow: 0 0 20px #ff2020; z-index: 10; }
  .roulette-pointer::before, .roulette-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent; }
  .roulette-pointer::before { top: -2px; border-top: 15px solid #ff2020; }
  .roulette-pointer::after { bottom: -2px; border-bottom: 15px solid #ff2020; }
  .rarity-common { background: linear-gradient(180deg, #2a2a3a, #1a1a2a); border-top: 4px solid #666; }
  .rarity-uncommon { background: linear-gradient(180deg, #1e3a2a, #0f2a1a); border-top: 4px solid #4fff4f; }
  .rarity-rare { background: linear-gradient(180deg, #1a2a4a, #0a1a3a); border-top: 4px solid #4f4fff; }
  .rarity-epic { background: linear-gradient(180deg, #3a1a4a, #2a0a3a); border-top: 4px solid #bf4fff; }
  .rarity-legendary { background: linear-gradient(180deg, #4a3a0a, #2a1a0a); border-top: 4px solid #ffaa00; }
  #notifications { position: fixed; top: 90px; right: 20px; z-index: 900; display: flex; flex-direction: column; gap: 8px; max-width: 300px; }
  .notif { background: #1a1a2e; padding: 10px 14px; border-radius: 10px; border-left: 4px solid #ffaa00; font-size: 13px; animation: notifIn 0.3s; }
  @keyframes notifIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .confetti { position: fixed; width: 8px; height: 8px; z-index: 800; pointer-events: none; animation: confettiFall 3s linear forwards; }
  @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  #achievements { max-width: 1000px; margin: 25px auto 0; padding: 18px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 2px solid #333; }
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
  .ach { background: #1a1a2a; border: 2px solid #333; border-radius: 8px; padding: 8px 12px; font-size: 12px; opacity: 0.5; }
  .ach.unlocked { opacity: 1; border-color: #ffaa00; background: linear-gradient(90deg, #2a2a0a, #1a1a2a); }
  .ach .ach-name { color: #ffaa00; font-weight: bold; margin-bottom: 2px; font-size: 13px; }
  .ach .ach-desc { color: #888; font-size: 10px; }
  #stats { max-width: 1000px; margin: 20px auto 0; padding: 18px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 2px solid #333; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat-box { text-align: center; padding: 10px; background: #1a1a2a; border-radius: 8px; }
  .stat-box .stat-val { font-size: 20px; color: #ffaa00; font-weight: bold; }
  .stat-box .stat-label { font-size: 11px; color: #888; margin-top: 3px; }
  #auto-section { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 1000px; margin: 15px auto; padding: 0 20px; }
  .upgrade { background: linear-gradient(160deg, #1e1e2e, #0f0f1a); border: 2px solid #333; border-radius: 12px; padding: 12px; text-align: center; min-width: 190px; flex: 1; max-width: 280px; }
  .upgrade h4 { color: #ffaa00; margin-bottom: 6px; font-size: 14px; }
  .upgrade .info { color: #888; font-size: 11px; margin-bottom: 8px; line-height: 1.4; }
  .upgrade button { padding: 7px 16px; background: linear-gradient(90deg, #4fff4f, #00aa00); border: none; border-radius: 18px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px; }
  .upgrade button:disabled { opacity: 0.4; cursor: not-allowed; background: #333; }
  .upgrade.prestige { border-color: #bf4fff; }
  .upgrade.prestige h4 { color: #bf4fff; }
  .upgrade.prestige button { background: linear-gradient(90deg, #bf4fff, #ff4fbf); }
  #history { max-width: 1000px; margin: 20px auto 0; padding: 18px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 2px solid #333; }
  .hist-list { display: flex; flex-direction: column; gap: 6px; }
  .hist-row { display: flex; justify-content: space-between; padding: 6px 10px; background: #1a1a2a; border-radius: 6px; font-size: 12px; border-left: 4px solid #666; }
  .hist-row .h-name { color: #ccc; }
  .hist-row .h-rarity { font-weight: bold; }
  body.light .hist-row { background: #fff; color: #111; }
  body.light .hist-row .h-name { color: #333; }
  #minigame { max-width: 1000px; margin: 25px auto 0; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 2px solid #333; text-align: center; }
  #minigame h3 { color: #ffaa00; margin-bottom: 12px; }
  .mg-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .mg-controls input { width: 120px; padding: 8px; border-radius: 8px; border: 2px solid #444; background: #0a0a15; color: #fff; text-align: center; font-size: 14px; }
  .mg-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .mg-btns button { padding: 10px 22px; border: none; border-radius: 20px; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
  .mg-red { background: linear-gradient(90deg, #ff2020, #aa0000); }
  .mg-black { background: linear-gradient(90deg, #333, #000); border: 2px solid #666 !important; }
  .mg-green { background: linear-gradient(90deg, #00aa00, #006600); }
  .mg-result { margin-top: 14px; font-size: 16px; min-height: 24px; color: #ffaa00; font-weight: bold; }
  #cloud-status { position: fixed; bottom: 8px; right: 12px; font-size: 11px; color: #888; z-index: 950; padding: 4px 10px; background: rgba(0,0,0,0.6); border-radius: 10px; }
  #cloud-status.online { color: #4fff4f; }
  #cloud-status.offline { color: #ff6060; }
  #cloud-status.saving { color: #ffaa00; }
  #admin-message-box { position: fixed; top: 80px; left: 0; right: 0; z-index: 9998; display: none; padding: 0 20px; }
  .admin-msg-banner { padding: 14px 20px; border-radius: 10px; text-align: center; font-weight: bold; color: #fff; font-size: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #music-box { position: fixed; bottom: 45px; left: 12px; z-index: 940; width: 300px; display: none; background: #0a0a15; border-radius: 10px; padding: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  #music-box iframe { border: none; border-radius: 8px; width: 100%; height: 80px; }
  @media (max-width: 600px) {
    .clicker-btn { width: 130px; height: 130px; font-size: 15px; }
    header h1 { font-size: 18px; }
    .balance-box { font-size: 16px; padding: 8px 14px; }
    #music-box { width: 220px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎁 КЕЙСЕР v4</h1>
  <div class="header-right">
    <div class="balance-box">💰 <span id="balance">1000</span> ₽</div>
    <div class="prestige-box" id="prestige-box">⭐ <span id="prestige-lvl">0</span></div>
    <div class="top-btns">
      <button id="daily-btn" onclick="claimDaily()">📅 Бонус</button>
      <button id="sound-btn" onclick="toggleSound()">🔊</button>
      <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </div>
</header>

<div id="admin-message-box"></div>
<div id="music-box"></div>

<div class="clicker-section">
  <button class="clicker-btn" id="clicker">КЛИК<br><span id="click-value">+5₽</span></button>
  <div class="clicker-hint" id="click-hint">Кликай чтобы заработать</div>
</div>

<div id="auto-section"></div>

<h2 class="section-title">🎰 КЕЙСЫ</h2>
<div class="cases-grid" id="cases-grid"></div>

<h2 class="section-title">🎲 МИНИ-ИГРА</h2>
<div id="minigame">
  <h3>Рулетка: Красное / Чёрное / Зелёное</h3>
  <div class="mg-controls">
    <input type="number" id="mg-bet" value="100" min="10" placeholder="Ставка">
  </div>
  <div class="mg-btns">
    <button class="mg-red" onclick="playRouletteMini('red')">🔴 ×2</button>
    <button class="mg-black" onclick="playRouletteMini('black')">⚫ ×2</button>
    <button class="mg-green" onclick="playRouletteMini('green')">🟢 ×14</button>
  </div>
  <div class="mg-result" id="mg-result"></div>
</div>

<h2 class="section-title">📜 ИСТОРИЯ ВЫПАДЕНИЙ</h2>
<div id="history">
  <div class="hist-list" id="hist-list"><div class="inv-empty">Пока пусто</div></div>
</div>

<h2 class="section-title">🎒 ИНВЕНТАРЬ</h2>
<div class="inventory">
  <div class="inv-title">
    <span>Ваши предметы (<span id="inv-count">0</span>)</span>
    <div class="inv-actions">
      <button onclick="upgradeItems()">⬆ Апгрейд 3→1</button>
      <button onclick="sellAll()">💸 Продать всё</button>
      <button onclick="sellDuplicates()">🗑 Продать дубли</button>
    </div>
  </div>
  <div class="inv-grid" id="inv-grid">
    <div class="inv-empty">Инвентарь пуст</div>
  </div>
</div>

<h2 class="section-title">📊 СТАТИСТИКА</h2>
<div id="stats"></div>

<h2 class="section-title">🏆 ДОСТИЖЕНИЯ</h2>
<div id="achievements">
  <div class="ach-grid" id="ach-grid"></div>
</div>

<div id="roulette-overlay">
  <div class="roulette-title">🎲 ОТКРЫТИЕ...</div>
  <div class="roulette-container">
    <div class="roulette-pointer"></div>
    <div class="roulette-track" id="roulette-track"></div>
  </div>
</div>

<div id="notifications"></div>

<div id="cloud-status">Cloud: connecting...</div>

<!-- ================== FIREBASE SDK ================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, child, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAkA83w29EWqc_LKKzFZtL3h6AhU4G7CWs",
    authDomain: "keyser-v4-55ede.firebaseapp.com",
    databaseURL: "https://keyser-v4-55ede-default-rtdb.firebaseio.com",
    projectId: "keyser-v4-55ede",
    storageBucket: "keyser-v4-55ede.firebasestorage.app",
    messagingSenderId: "561573985618",
    appId: "1:561573985618:web:c57eb25736b1cde8a48e8b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let PLAYER_ID = localStorage.getItem('keyser_player_id');
  if (!PLAYER_ID) {
    PLAYER_ID = 'player_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('keyser_player_id', PLAYER_ID);
  }
  console.log('Firebase Player ID:', PLAYER_ID);
  window.KEYSER_PLAYER_ID = PLAYER_ID;

  function setStatus(text, cls) {
    const el = document.getElementById('cloud-status');
    if (!el) return;
    el.textContent = text;
    el.className = cls || '';
  }

  window.firebaseSave = async function(data) {
    setStatus('Cloud: saving...', 'saving');
    try {
      await set(ref(db, 'saves/' + PLAYER_ID), data);
      setStatus('Cloud: saved', 'online');
    } catch (e) {
      console.error('Save error:', e);
      setStatus('Cloud: error', 'offline');
    }
  };

  window.firebaseLoad = async function() {
    setStatus('Cloud: loading...', 'saving');
    try {
      const snapshot = await get(child(ref(db), 'saves/' + PLAYER_ID));
      if (snapshot.exists()) {
        setStatus('Cloud: loaded', 'online');
        return snapshot.val();
      }
      setStatus('Cloud: new player', 'online');
      return null;
    } catch (e) {
      console.error('Load error:', e);
      setStatus('Cloud: no access', 'offline');
      return null;
    }
  };

  window.firebaseReset = async function() {
    try {
      await remove(ref(db, 'saves/' + PLAYER_ID));
      setStatus('Cloud: reset', 'online');
    } catch (e) {
      setStatus('Cloud: reset error', 'offline');
    }
  };

  // ============ ADMIN MESSAGES ============
  onValue(ref(db, 'messages/broadcast'), (snap) => {
    if (!snap.exists()) return;
    const msg = snap.val();
    if (Date.now() - (msg.createdAt || 0) > 24 * 60 * 60 * 1000) return;
    showAdminMessage(msg);
  });

  onValue(ref(db, 'messages/players/' + PLAYER_ID), (snap) => {
    if (!snap.exists()) return;
    const msg = snap.val();
    if (Date.now() - (msg.createdAt || 0) > 24 * 60 * 60 * 1000) return;
    showAdminMessage(msg);
  });

  // ============ GIFTS ============
  onValue(ref(db, 'events/giftMoney'), (snap) => {
    if (!snap.exists()) return;
    const ev = snap.val();
    const key = 'last_gift_money_' + ev.createdAt;
    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1');
    if (typeof state !== 'undefined') {
      state.balance += ev.amount;
      state.totalEarned += ev.amount;
      if (typeof updateBalance === 'function') updateBalance();
      if (typeof save === 'function') save();
      if (typeof notify === 'function') notify('+ ' + ev.amount.toLocaleString('ru-RU') + ' RUB!', '#4fff4f');
    }
  });

  onValue(ref(db, 'events/giftPrestige'), (snap) => {
    if (!snap.exists()) return;
    const ev = snap.val();
    const key = 'last_gift_prestige_' + ev.createdAt;
    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1');
    if (typeof state !== 'undefined') {
      state.prestige += ev.amount;
      if (typeof updatePrestige === 'function') updatePrestige();
      if (typeof updateClickValue === 'function') updateClickValue();
      if (typeof save === 'function') save();
      if (typeof notify === 'function') notify('+ ' + ev.amount + ' prestige!', '#bf4fff');
    }
  });

  onValue(ref(db, 'events/giftCases'), (snap) => {
    if (!snap.exists()) return;
    const ev = snap.val();
    const key = 'last_gift_cases_' + ev.createdAt;
    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1');
    if (typeof state !== 'undefined') {
      if (!state.giftedCases) state.giftedCases = [];
      for (let i = 0; i < ev.count; i++) {
        state.giftedCases.push({ caseType: ev.caseType, claimed: false });
      }
      if (typeof save === 'function') save();
      if (typeof notify === 'function') notify('+' + ev.count + ' cases (' + ev.caseType + ')!', '#ffaa00');
    }
  });

  // ============ MUSIC ============
  onValue(ref(db, 'config/music'), (snap) => {
    if (!snap.exists()) return;
    const m = snap.val();
    const box = document.getElementById('music-box');
    if (!box) return;
    if (m.enabled && m.url) {
      box.innerHTML = '<iframe frameborder="0" src="' + m.url + '"></iframe>';
      box.style.display = 'block';
    } else {
      box.style.display = 'none';
      box.innerHTML = '';
    }
  });

  window.showAdminMessage = function(msg) {
    const key = 'seen_msg_' + (msg.createdAt || 0);
    if (localStorage.getItem(key)) return;
    localStorage.setItem(key, '1');
    const box = document.getElementById('admin-message-box');
    box.innerHTML = '<div class="admin-msg-banner" style="background:' + (msg.color || '#ffaa00') + '">📢 ' + msg.text + '</div>';
    box.style.display = 'block';

<script>
var audioCtx = null;
var soundEnabled = true;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol, slide) {
  if (!soundEnabled) return;
  try {
    initAudio();
    type = type || 'sine'; vol = vol || 0.12; slide = slide || 0;
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
var SFX = {
  click: function() { beep(900, 0.06, 'square', 0.08); },
  buy: function() { beep(600, 0.1, 'sine', 0.12); setTimeout(function(){ beep(900, 0.15, 'sine', 0.12); }, 80); },
  tick: function() { beep(1400 + Math.random()*500, 0.02, 'square', 0.05); },
  win: function() { beep(500,0.1,'sine',0.13); setTimeout(function(){beep(700,0.1,'sine',0.13);},100); setTimeout(function(){beep(1000,0.2,'sine',0.13);},200); },
  legendary: function() { [523,659,784,1046,1318].forEach(function(f,i){ setTimeout(function(){beep(f,0.25,'triangle',0.2);}, i*120); }); },
  error: function() { beep(200, 0.15, 'sawtooth', 0.12); },
  notify: function() { beep(900, 0.08, 'sine', 0.1); },
  achievement: function() { beep(1200,0.1,'sine',0.15); setTimeout(function(){beep(1500,0.1,'sine',0.15);},100); setTimeout(function(){beep(2000,0.2,'sine',0.15);},200); },
  konami: function() { [523,659,784,1046,1318,1568].forEach(function(f,i){ setTimeout(function(){beep(f,0.15,'triangle',0.2);}, i*80); }); },
  prestige: function() { [200,300,400,500,600,800,1000].forEach(function(f,i){ setTimeout(function(){beep(f,0.2,'sawtooth',0.15);}, i*100); }); }
};

];

var RARITY_COLOR = { common: '#888', uncommon: '#4fff4f', rare: '#4f4fff', epic: '#bf4fff', legendary: '#ffaa00' };
var RARITY_NAMES = { common: 'Обычный', uncommon: 'Необычный', rare: 'Редкий', epic: 'Эпический', legendary: 'ЛЕГЕНДАРНЫЙ' };

var ACHIEVEMENTS = [

  { id: 'clicker_100', name: 'Кликер-100', desc: 'Кликни 100 раз' },

];

var state = {
  balance: 1000, inventory: [], spinning: false, clickTimes: [],
  clickValue: 5, autoClicker: 0, totalClicks: 0, totalCases: 0,
  totalEarned: 0, totalSpent: 0, legendaryDrops: 0, upgrades: 0,
  konamiFound: false, lastDaily: 0, achievements: [], theme: 'dark',
  prestige: 0, history: [], giftedCases: [],
  soundEnabled: true
};

var cloudReady = false;
var saveTimeout = null;

function save() {
  try {
    localStorage.setItem('keyser_v4', JSON.stringify({
      balance: state.balance, inventory: state.inventory, clickValue: state.clickValue,
      autoClicker: state.autoClicker, totalClicks: state.totalClicks, totalCases: state.totalCases,
      totalEarned: state.totalEarned, totalSpent: state.totalSpent, legendaryDrops: state.legendaryDrops,
      upgrades: state.upgrades, konamiFound: state.konamiFound, lastDaily: state.lastDaily,
      achievements: state.achievements, theme: state.theme,
      prestige: state.prestige, history: state.history, giftedCases: state.giftedCases,
      soundEnabled: state.soundEnabled
    }));
  } catch(e){}

  if (cloudReady && window.firebaseSave) {
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function() {
      window.firebaseSave({
        balance: state.balance, inventory: state.inventory, clickValue: state.clickValue,
        autoClicker: state.autoClicker, totalClicks: state.totalClicks, totalCases: state.totalCases,
        totalEarned: state.totalEarned, totalSpent: state.totalSpent, legendaryDrops: state.legendaryDrops,
        upgrades: state.upgrades, konamiFound: state.konamiFound, lastDaily: state.lastDaily,
        achievements: state.achievements, theme: state.theme,
        prestige: state.prestige, history: state.history, giftedCases: state.giftedCases,
        soundEnabled: state.soundEnabled
      });
    }, 1500);
  }
}

function load() {
  try {
    var d = localStorage.getItem('keyser_v4');
    if (d) applyLoadedData(JSON.parse(d));
  } catch(e){}
}

function applyLoadedData(p) {
  state.balance = p.balance != null ? p.balance : 1000;
  state.inventory = p.inventory || [];
  state.clickValue = p.clickValue != null ? p.clickValue : 5;
  state.autoClicker = p.autoClicker != null ? p.autoClicker : 0;
  state.totalClicks = p.totalClicks || 0;
  state.totalCases = p.totalCases || 0;
  state.totalEarned = p.totalEarned || 0;
  state.totalSpent = p.totalSpent || 0;
  state.legendaryDrops = p.legendaryDrops || 0;
  state.upgrades = p.upgrades || 0;
  state.konamiFound = p.konamiFound || false;
  state.lastDaily = p.lastDaily || 0;
  state.achievements = p.achievements || [];
  state.theme = p.theme || 'dark';
  state.prestige = p.prestige || 0;
  state.history = p.history || [];
  state.giftedCases = p.giftedCases || [];
  state.soundEnabled = p.soundEnabled != null ? p.soundEnabled : true;
}

function updateBalance() { document.getElementById('balance').textContent = Math.floor(state.balance).toLocaleString('ru-RU'); }
function updatePrestige() { var el = document.getElementById('prestige-lvl'); if (el) el.textContent = state.prestige; }

function notify(text, color) {
  color = color || '#ffaa00';
  var cont = document.getElementById('notifications');
  var n = document.createElement('div');
  n.className = 'notif';
  n.style.borderLeftColor = color;
  n.textContent = text;
  cont.appendChild(n);
  SFX.notify();
  setTimeout(function(){ n.remove(); }, 3000);
}

function confetti(count) {
  count = count || 40;
  var colors = ['#ff2020','#ffaa00','#4fff4f','#4f4fff','#bf4fff','#ff4fbf'];
  for (var i = 0; i < count; i++) {
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * window.innerWidth + 'px';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.borderRadius = Math.random() < 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    (function(el){ setTimeout(function(){ el.remove(); }, 3500); })(c);
  }
}

function doClick(e) {
  var val = state.clickValue + state.prestige * 5;
  state.balance += val;
  state.totalClicks++;
  state.totalEarned += val;
  updateBalance();
  save();
  SFX.click();
  var anim = document.createElement('div');
  anim.className = 'click-anim';
  anim.textContent = '+' + val + '₽';
  var x = e ? e.clientX : window.innerWidth/2;
  var y = e ? e.clientY : window.innerHeight/2;
  anim.style.left = (x - 20) + 'px';
  anim.style.top = (y - 20) + 'px';
  document.body.appendChild(anim);
  setTimeout(function(){ anim.remove(); }, 1000);
  checkAchievements();
  renderStats();
}

function renderCases() {
  var grid = document.getElementById('cases-grid');
  if (!grid) return;
  grid.innerHTML = '';
  CASES.forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'case';
    var canAfford = state.balance >= c.price;
    var disabled = state.spinning || !canAfford;
    div.innerHTML =
      '<div class="case-icon">' + c.icon + '</div>' +
      '<h3>' + c.name + '</h3>' +
      '<div class="price-tag">' + c.price.toLocaleString('ru-RU') + ' ₽</div>' +
      '<button class="open-btn"' + (disabled ? ' disabled' : '') + '>ОТКРЫТЬ</button>';
    div.querySelector('.open-btn').addEventListener('click', function(){ openCase(c); });
    grid.appendChild(div);
  });
}

function openCase(c) {
  if (state.spinning) return;
  if (state.balance < c.price) { SFX.error(); notify('Недостаточно денег!', '#ff2020'); return; }
  state.balance -= c.price;
  state.totalSpent += c.price;
  state.totalCases++;
  updateBalance();
  save();
  state.spinning = true;
  SFX.buy();
  renderCases();
  spinRoulette(c);
}

function pickItem(c) {
  var total = 0;
  c.items.forEach(function(i){ total += i.chance; });
  var r = Math.random() * total;
  for (var i = 0; i < c.items.length; i++) {
    r -= c.items[i].chance;
    if (r <= 0) return c.items[i];
  }
  return c.items[0];
}

function spinRoulette(c) {
  var overlay = document.getElementById('roulette-overlay');
  var track = document.getElementById('roulette-track');
  overlay.classList.add('active');
  var winner = pickItem(c);
  var items = [];
  for (var i = 0; i < 45; i++) items.push(c.items[Math.floor(Math.random()*c.items.length)]);
  items.push(winner);
  for (var j = 0; j < 10; j++) items.push(c.items[Math.floor(Math.random()*c.items.length)]);
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  items.forEach(function(it) {
    var el = document.createElement('div');
    el.className = 'roulette-item rarity-' + it.rarity;
    el.innerHTML = '<div class="icon">' + it.icon + '</div><div class="name">' + it.name + '</div>';
    track.appendChild(el);
  });
  var ITEM_W = 140;
  var containerW = document.querySelector('.roulette-container').offsetWidth;
  var targetIndex = 45;
  var offset = targetIndex * ITEM_W + ITEM_W / 2 - containerW / 2;
  var jitter = (Math.random() - 0.5) * (ITEM_W * 0.6);
  var finalOffset = offset + jitter;
  void track.offsetWidth;
  track.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.3, 1)';
  track.style.transform = 'translateX(-' + finalOffset + 'px)';
  var ticks = 0;
  var tickInterval = setInterval(function() {
    ticks++;
    SFX.tick();
    if (ticks > 30) clearInterval(tickInterval);
  }, 100);
  setTimeout(function() {
    clearInterval(tickInterval);
    overlay.classList.remove('active');
    awardItem(winner);
    state.spinning = false;
    renderCases();
  }, 5200);
}

function awardItem(item) {
  state.inventory.push({ name: item.name, icon: item.icon, price: item.price, rarity: item.rarity });
  if (item.rarity === 'legendary') state.legendaryDrops++;
  state.history.unshift({ name: item.name, icon: item.icon, rarity: item.rarity, time: Date.now() });
  if (state.history.length > 10) state.history = state.history.slice(0, 10);
  save();
  renderInventory();
  renderStats();
  renderHistory();
  if (item.rarity === 'legendary' || item.rarity === 'epic') {
    SFX.legendary();
    confetti(item.rarity === 'legendary' ? 60 : 30);
  } else {
    SFX.win();
  }
  notify(item.name + ' (' + RARITY_NAMES[item.rarity] + ')', RARITY_COLOR[item.rarity]);
  checkAchievements();
}

function renderInventory() {
  var grid = document.getElementById('inv-grid');
  document.getElementById('inv-count').textContent = state.inventory.length;
  if (state.inventory.length === 0) {
    grid.innerHTML = '<div class="inv-empty">Инвентарь пуст</div>';
    return;
  }
  grid.innerHTML = '';
  state.inventory.forEach(function(item, idx) {
    var div = document.createElement('div');
    div.className = 'inv-item ' + item.rarity;
    div.style.borderColor = RARITY_COLOR[item.rarity];
    div.innerHTML =
      '<div class="icon">' + item.icon + '</div>' +
      '<div class="name">' + item.name + '</div>' +
      '<div class="price">' + item.price.toLocaleString('ru-RU') + ' ₽</div>';
    div.title = 'Клик — продать за ' + item.price + ' ₽';
    div.addEventListener('click', function(){ sellItem(idx); });
    grid.appendChild(div);
  });
}

function sellItem(idx) {
  var item = state.inventory[idx];
  if (!item) return;
  if (!confirm('Продать "' + item.name + '" за ' + item.price + ' ₽?')) return;
  state.balance += item.price;
  state.totalEarned += item.price;
  state.inventory.splice(idx, 1);
  updateBalance(); save();
  renderInventory(); renderStats();
  SFX.buy();
  notify('Продано: ' + item.name + ' +' + item.price + ' ₽', '#4fff4f');
  checkAchievements();
}

function sellAll() {
  if (state.inventory.length === 0) { notify('Инвентарь пуст', '#ff2020'); return; }
  var total = 0;
  state.inventory.forEach(function(i){ total += i.price; });
  if (!confirm('Продать ВСЁ (' + state.inventory.length + ' шт) за ' + total + ' ₽?')) return;
  state.balance += total;
  state.totalEarned += total;
  state.inventory = [];
  updateBalance(); save();
  renderInventory(); renderStats();
  SFX.buy();
  notify('Продано всё за ' + total.toLocaleString('ru-RU') + ' ₽', '#4fff4f');
  checkAchievements();
}

function sellDuplicates() {
  var kept = {};
  var newInv = [];
  var toSell = [];
  state.inventory.forEach(function(item) {
    if (!kept[item.name]) { kept[item.name] = true; newInv.push(item); }
    else toSell.push(item);
  });
  if (toSell.length === 0) { notify('Дублей нет', '#ffaa00'); return; }
  var total = toSell.reduce(function(s, i){ return s + i.price; }, 0);
  if (!confirm('Продать ' + toSell.length + ' дублей за ' + total + ' ₽?')) return;
  state.balance += total;
  state.totalEarned += total;
  state.inventory = newInv;
  updateBalance(); save();
  renderInventory(); renderStats();
  SFX.buy();
  notify('Продано дублей на ' + total.toLocaleString('ru-RU') + ' ₽', '#4fff4f');
}

function upgradeItems() {
  var rarities = ['common', 'uncommon', 'rare', 'epic'];
  for (var r = 0; r < rarities.length; r++) {
    var rar = rarities[r];
    var sameRarity = state.inventory.filter(function(i){ return i.rarity === rar; });
    if (sameRarity.length >= 3) {
      var chosen = sameRarity.slice(0, 3);
      var nextRar = rarities[r + 1] || 'legendary';
      if (!confirm('Апгрейд 3×' + RARITY_NAMES[rar] + ' → 1×' + RARITY_NAMES[nextRar] + '?')) return;
      chosen.forEach(function(ch) {
        var idx = state.inventory.indexOf(ch);
        if (idx >= 0) state.inventory.splice(idx, 1);
      });
      var pool = [];
      CASES.forEach(function(c){ c.items.forEach(function(i){ if (i.rarity === nextRar) pool.push(i); }); });
      if (pool.length === 0) pool = [{ name: 'Mystery Item', icon: '?', price: 1000, rarity: nextRar }];
      var newItem = pool[Math.floor(Math.random() * pool.length)];
      state.inventory.push({ name: newItem.name, icon: newItem.icon, price: newItem.price, rarity: nextRar });
      state.upgrades++;
      save(); renderInventory(); renderStats();
      SFX.legendary();
      confetti(30);
      notify('Апгрейд! Получен: ' + newItem.name, RARITY_COLOR[nextRar]);
      checkAchievements();
      return;
    }
  }
  notify('Нужно 3 предмета одной редкости', '#ff2020');
}

function renderHistory() {
  var el = document.getElementById('hist-list');
  if (!el) return;
  if (!state.history || state.history.length === 0) {
    el.innerHTML = '<div class="inv-empty">Пока пусто</div>';
    return;
  }
  el.innerHTML = '';
  state.history.forEach(function(h) {
    var row = document.createElement('div');
    row.className = 'hist-row';
    row.style.borderLeftColor = RARITY_COLOR[h.rarity];
    row.innerHTML = '<span class="h-name">' + h.icon + ' ' + h.name + '</span>' +
      '<span class="h-rarity" style="color:' + RARITY_COLOR[h.rarity] + '">' + RARITY_NAMES[h.rarity] + '</span>';
    el.appendChild(row);
  });
}

function playRouletteMini(color) {
  var bet = parseInt(document.getElementById('mg-bet').value) || 0;
  var resultEl = document.getElementById('mg-result');
  if (bet < 10) { resultEl.textContent = 'Мин. ставка 10 ₽'; SFX.error(); return; }
  if (state.balance < bet) { resultEl.textContent = 'Недостаточно денег'; SFX.error(); return; }
  state.balance -= bet;
  state.totalSpent += bet;
  updateBalance();
  var roll = Math.floor(Math.random() * 15);
  var winColor = roll === 0 ? 'green' : (Math.random() < 0.5 ? 'red' : 'black');
  var win = (color === winColor);
  if (win) {
    var mult = color === 'green' ? 14 : 2;
    var payout = bet * mult;
    state.balance += payout;
    state.totalEarned += payout;
    resultEl.textContent = 'Победа! +' + (payout - bet) + ' ₽';
    resultEl.style.color = '#4fff4f';
    SFX.win();
    confetti(20);
  } else {
    resultEl.textContent = 'Проигрыш ' + bet + ' ₽';
    resultEl.style.color = '#ff2020';
    SFX.error();
  }
  updateBalance(); save(); renderStats();
  checkAchievements();
}

function renderStats() {
  var el = document.getElementById('stats');
  if (!el) return;
  el.innerHTML =
    '<div class="stat-box"><div class="stat-val">' + state.totalClicks.toLocaleString('ru-RU') + '</div><div class="stat-label">Кликов</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + state.totalCases.toLocaleString('ru-RU') + '</div><div class="stat-label">Кейсов</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + state.totalEarned.toLocaleString('ru-RU') + ' ₽</div><div class="stat-label">Заработано</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + state.totalSpent.toLocaleString('ru-RU') + ' ₽</div><div class="stat-label">Потрачено</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + state.legendaryDrops + '</div><div class="stat-label">Легендарок</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + state.upgrades + '</div><div class="stat-label">Апгрейдов</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + state.prestige + '</div><div class="stat-label">Престиж</div></div>';
}

function renderUpgrades() {
  var el = document.getElementById('auto-section');
  if (!el) return;
  var autoPrice = Math.max(500, Math.floor(500 * Math.pow(1.5, state.autoClicker / 5)));
  var clickPrice = Math.max(1000, Math.floor(1000 * Math.pow(1.7, (state.clickValue - 5) / 5)));
  var prestigeReq = 10000 * (state.prestige + 1);
  el.innerHTML =
    '<div class="upgrade">' +
      '<h4>🤖 Автокликер</h4>' +
      '<div class="info">Даёт ' + state.autoClicker + ' ₽/сек<br>Цена: ' + autoPrice.toLocaleString('ru-RU') + ' ₽</div>' +
      '<button onclick="buyAuto()" ' + (state.balance < autoPrice ? 'disabled' : '') + '>Купить +5₽/сек</button>' +
    '</div>' +
    '<div class="upgrade">' +
      '<h4>💪 Улучшить клик</h4>' +
      '<div class="info">Сейчас: +' + (state.clickValue + state.prestige * 5) + '₽/клик<br>Цена: ' + clickPrice.toLocaleString('ru-RU') + ' ₽</div>' +
      '<button onclick="buyClick()" ' + (state.balance < clickPrice ? 'disabled' : '') + '>Купить +5₽</button>' +
    '</div>' +
    '<div class="upgrade prestige">' +
      '<h4>⭐ Престиж ' + state.prestige + '</h4>' +
      '<div class="info">Бонус: +' + (state.prestige * 5) + '₽ к клику<br>Сброс за +5₽/клик навсегда<br>Нужно: ' + prestigeReq.toLocaleString('ru-RU') + ' ₽</div>' +
      '<button onclick="doPrestige()" ' + (state.balance < prestigeReq ? 'disabled' : '') + '>Сделать престиж</button>' +
    '</div>';
}

function buyAuto() {
  var price = Math.max(500, Math.floor(500 * Math.pow(1.5, state.autoClicker / 5)));
  if (state.balance < price) return;
  state.balance -= price;
  state.autoClicker += 5;
  updateBalance(); save(); renderUpgrades();
  SFX.buy();
  notify('Автокликер: +5₽/сек', '#4fff4f');
  checkAchievements();
}

function buyClick() {
  var price = Math.max(1000, Math.floor(1000 * Math.pow(1.7, (state.clickValue - 5) / 5)));
  if (state.balance < price) return;
  state.balance -= price;
  state.clickValue += 5;
  updateBalance(); save(); renderUpgrades(); updateClickValue();
  SFX.buy();
  notify('Клик: +' + state.clickValue + '₽', '#4fff4f');
}

function doPrestige() {
  var req = 10000 * (state.prestige + 1);
  if (state.balance < req) return;
  if (!confirm('Престиж сбросит баланс, инвентарь и апгрейды, но даст +5₽ к клику навсегда. Продолжить?')) return;
  state.prestige++;
  state.balance = 1000;
  state.inventory = [];
  state.clickValue = 5;
  state.autoClicker = 0;
  state.upgrades = 0;
  updateBalance(); save();
  renderInventory(); renderStats(); renderUpgrades(); updateClickValue(); updatePrestige();
  SFX.prestige();
  confetti(80);
  notify('Престиж ' + state.prestige + '! +5₽ к клику навсегда', '#bf4fff');
  checkAchievements();
}

function updateClickValue() {
  document.getElementById('click-value').textContent = '+' + (state.clickValue + state.prestige * 5) + '₽';
  document.getElementById('click-hint').textContent = 'Кликай чтобы заработать (авто: ' + state.autoClicker + '₽/сек)';
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(function(a) {
    if (state.achievements.indexOf(a.id) >= 0) return;
    var ok = false;
    if (a.id === 'first_click') ok = state.totalClicks >= 1;
    else if (a.id === 'clicker_100') ok = state.totalClicks >= 100;
    else if (a.id === 'clicker_1000') ok = state.totalClicks >= 1000;
    else if (a.id === 'first_case') ok = state.totalCases >= 1;
    else if (a.id === 'case_10') ok = state.totalCases >= 10;
    else if (a.id === 'case_100') ok = state.totalCases >= 100;
    else if (a.id === 'rich_1000') ok = state.balance >= 1000;
    else if (a.id === 'rich_10000') ok = state.balance >= 10000;
    else if (a.id === 'rich_100000') ok = state.balance >= 100000;
    else if (a.id === 'legend_drop') ok = state.legendaryDrops >= 1;
    else if (a.id === 'legend_3') ok = state.legendaryDrops >= 3;
    else if (a.id === 'auto_1') ok = state.autoClicker > 0;
    else if (a.id === 'upgrade_1') ok = state.upgrades >= 1;
    else if (a.id === 'konami') ok = state.konamiFound;
    else if (a.id === 'prestige_1') ok = state.prestige >= 1;
    if (ok) {
      state.achievements.push(a.id);
      SFX.achievement();
      confetti(15);
      notify('Достижение: ' + a.name, '#ffaa00');
      save();
      renderAchievements();
    }
  });
}

function renderAchievements() {
  var el = document.getElementById('ach-grid');
  if (!el) return;
  el.innerHTML = '';
  ACHIEVEMENTS.forEach(function(a) {
    var unlocked = state.achievements.indexOf(a.id) >= 0;
    var div = document.createElement('div');
    div.className = 'ach' + (unlocked ? ' unlocked' : '');
    div.innerHTML = '<div class="ach-name">' + (unlocked ? '🏆 ' : '🔒 ') + a.name + '</div><div class="ach-desc">' + a.desc + '</div>';
    el.appendChild(div);
  });
}

function claimDaily() {
  var now = Date.now();
  var DAY = 24 * 60 * 60 * 1000;
  if (now - state.lastDaily < DAY) {
    var left = DAY - (now - state.lastDaily);
    var h = Math.floor(left / 3600000);
    var m = Math.floor((left % 3600000) / 60000);
    notify('Бонус через ' + h + 'ч ' + m + 'м', '#ff2020');
    SFX.error();
    return;
  }
  state.lastDaily = now;
  var bonus = 500 + state.prestige * 250;
  state.balance += bonus;
  state.totalEarned += bonus;
  updateBalance(); save();
  SFX.achievement();
  confetti(50);
  notify('Бонус: +' + bonus + '₽', '#4fff4f');
  updateDailyButton();
}

function updateDailyButton() {
  var btn = document.getElementById('daily-btn');
  if (!btn) return;
  var now = Date.now();
  var DAY = 24 * 60 * 60 * 1000;
  if (now - state.lastDaily < DAY) {
    var left = DAY - (now - state.lastDaily);
    var h = Math.floor(left / 3600000);
    var m = Math.floor((left % 3600000) / 60000);
    btn.textContent = '⏳ ' + h + 'ч ' + m + 'м';
    btn.disabled = true;
    btn.style.opacity = '0.5';
  } else {
    btn.textContent = '📅 Бонус +500₽';
    btn.disabled = false;
    btn.style.opacity = '1';
  }
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  save();
}
function applyTheme() {
  document.body.classList.toggle('light', state.theme === 'light');
  var btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = state.theme === 'light' ? '☀️' : '🌙';
}

function toggleSound() {
  state.soundEnabled = !state.soundEnabled;
  soundEnabled = state.soundEnabled;
  var btn = document.getElementById('sound-btn');
  if (btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
  save();
  notify(soundEnabled ? 'Звук включён' : 'Звук выключен', '#bf4fff');
}

var konamiSeq = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
var konamiIdx = 0;
document.addEventListener('keydown', function(e) {
  var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === konamiSeq[konamiIdx]) {
    konamiIdx++;
    if (konamiIdx === konamiSeq.length) {
      konamiIdx = 0;
      if (!state.konamiFound) {
        state.konamiFound = true;
        state.balance += 10000;
        state.totalEarned += 10000;
        updateBalance(); save();
        SFX.konami();
        confetti(100);
        notify('KONAMI! +10000₽', '#ffaa00');
        checkAchievements();
      } else {
        notify('Konami уже найден', '#888');
      }
    }
  } else {
    konamiIdx = 0;
  }
});

setInterval(function() {
  if (state.autoClicker > 0) {
    state.balance += state.autoClicker;
    state.totalEarned += state.autoClicker;
    updateBalance(); save();
  }
}, 1000);

setInterval(function() {
  if (!state.spinning) renderCases();
  renderUpgrades();
}, 800);

setInterval(updateDailyButton, 30000);

document.addEventListener('firebase-ready', function() {
  cloudReady = true;
  console.log('Firebase ready');
});

function init() {
  load();
  soundEnabled = state.soundEnabled;
  applyTheme();
  updateBalance();
  updatePrestige();
  updateClickValue();
  renderCases();
  renderInventory();
  renderStats();
  renderUpgrades();
  renderAchievements();
  renderHistory();
  updateDailyButton();

  var soundBtn = document.getElementById('sound-btn');
  if (soundBtn) soundBtn.textContent = soundEnabled ? '🔊' : '🔇';

  document.getElementById('clicker').addEventListener('click', doClick);

  if (window.firebaseLoad) {
    window.firebaseLoad().then(function(cloudData) {
      cloudReady = true;
      if (cloudData) {
        applyLoadedData(cloudData);
        updateBalance();
        updatePrestige();
        updateClickValue();
        renderInventory();
        renderStats();
        renderUpgrades();
        renderAchievements();
        renderHistory();
        applyTheme();
        console.log('Cloud data loaded');
      } else {
        save();
      }
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
